<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coffee & Walk | FrenDen</title>

    <link rel="stylesheet" href="style.css" />
</head>


<body>

    <header class="header">

        <div class="header-left">
            <a href="index.html" class="logo">FrenDen</a>
        </div>

        <div class="header-center">
            <div class="search">
                <input type="text" placeholder="Search experiences..." />
                <button class="search-btn">⌕</button>
            </div>
        </div>

        <div class="header-right">
            <button class="nav-btn">Create</button>
            <button class="icon-btn">🌿</button>
            <button class="profile">🙂</button>
        </div>

    </header>


    <main class="main">


        <div class="breadcrumbs">

            <a href="index.html">Home</a>

            <span>›</span>

            <span class="current">Coffee & Walk</span>

        </div>


        <section class="intro">

            <h1>Coffee & Walk</h1>

            <p>
                Find people for coffee, walks and relaxed moments.
            </p>

        </section>



        <section class="grid">


            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Coffee</div>
                <div class="card-sub">
                    Cafés · Morning coffee · New places
                </div>
            </div>


            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Walks</div>
                <div class="card-sub">
                    Parks · Streets · Conversations
                </div>
            </div>


            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Sunset Walks</div>
                <div class="card-sub">
                    Evening walks · Views · Calm moments
                </div>
            </div>


        </section>


    </main>


</body>

</html>
