<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | FrenDen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page">

    <header class="header">

        <div class="header-left">
            <a href="index.html" class="logo">FrenDen</a>
        </div>

        <div class="header-center">
        </div>

        <div class="header-right">
            <button class="profile">🙂</button>
        </div>

    </header>

    <main class="main">
        <div class="breadcrumbs">

            <a href="index.html">Home</a>

            <span>›</span>

            <a href="coffee-walk.html">Coffee & Walk</a>

            <span>›</span>

            <a href="coffee.html">Coffee</a>

            <span>›</span>

            <a href="anna-profile.html">Anna</a>

            <span>›</span>

            <span class="current">Chat</span>

        </div>

        <section class="chat-header">

            <div class="chat-avatar">
                <img src="https://i.pravatar.cc/200?img=47" alt="Anna">
            </div>

            <div class="chat-info">

                <h2>Anna</h2>

                <div class="meeting-status">
                    ☕ Today after 18:00
                </div>
            </div>
        </section>


        <div class="chat-area">

            <section class="chat-messages">

                <div class="message message-sent">
                    Hi Anna! 👋
                </div>

                <div class="message message-received">
                    Hi! 😊
                </div>

                <div class="message message-sent">
                    How are you?
                </div>

            </section>
            <div class="quick-actions">

                <button id="find-place">📍 Find a place</button>

            </div>

            <div class="place-map" id="place-map">
            </div>


            <div class="chat-input">

                <input type="text" placeholder="Type a message...">

                <button class="send-button">➤</button>

            </div>
        </div>
    </main>
    <script>
        const messageInput = document.querySelector(".chat-input input");
        const sendButton = document.querySelector(".send-button");
        const chatMessages = document.querySelector(".chat-messages");
        const suggestTimeButton = document.querySelector("#suggest-time");

        function sendMessage() {
            const text = messageInput.value.trim();

            if (text === "") return;

            const message = document.createElement("div");

            message.className = "message message-sent";
            message.textContent = text;

            chatMessages.appendChild(message);

            messageInput.value = "";

            messageInput.focus();
        }

        sendButton.addEventListener("click", sendMessage);

        messageInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        suggestTimeButton.addEventListener("click", function () {
            messageInput.value = "How about today after 18:00? ☕";
            sendMessage();
        });
    </script>


</body>

</html>
