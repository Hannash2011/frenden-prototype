<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | FrenDen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="chat-page">

    <header class="header">

        <div class="header-left">
            <a href="index.html" class="logo">FrenDen</a>
        </div>

        <div class="header-center">
        </div>

        <div class="header-right">
            <button class="profile">🙂</button>
        </div>

    </header>

    <main class="main">
        <div class="breadcrumbs">

            <a href="index.html">Home</a>

            <span>›</span>

            <a href="coffee-walk.html">Coffee & Walk</a>

            <span>›</span>

            <a href="coffee.html">Coffee</a>

            <span>›</span>

            <a href="anna-profile.html">Anna</a>

            <span>›</span>

            <span class="current">Chat</span>

        </div>

        <section class="chat-header">

            <div class="chat-avatar">
                <img src="https://i.pravatar.cc/200?img=47" alt="Anna">
            </div>

            <div class="chat-info">

                <h2>Anna</h2>

                <div class="meeting-status">
                    ☕ Today after 18:00
                </div>
            </div>
        </section>


        <div class="chat-area">

            <section class="chat-messages">

                <div class="message message-sent">
                    Hi Anna! 👋
                </div>

                <div class="message message-received">
                    Hi! 😊
                </div>

                <div class="message message-sent">
                    How are you?
                </div>

            </section>
            <div class="quick-actions">

                <button id="find-place">📍 Find a place</button>

            </div>

            <div class="place-options" id="place-options">

                <div class="place-title">
                    📍 Choose a place
                </div>

                <button class="place-option" data-place="☕ Coffee House" data-type="Café" data-address="Kristiansund">
                    ☕ Coffee House
                    <span>Café</span>
                </button>

                <button class="place-option" data-place="🌳 City Park" data-type="Park" data-address="Kristiansund">
                    🌳 City Park
                    <span>Park</span>
                </button>

                <button class="place-option" data-place="🎬 Cinema" data-type="Cinema" data-address="Kristiansund">
                    🎬 Cinema
                    <span>Cinema</span>
                </button>

                <button class="place-option" data-place="🏋️ Fitness Center" data-type="Fitness"
                    data-address="Kristiansund">
                    🏋️ Fitness Center
                    <span>Fitness</span>
                </button>

            </div>


            <div class="place-map" id="place-map">
            </div>


            <div class="chat-input">

                <input type="text" placeholder="Type a message...">

                <button class="send-button">➤</button>

            </div>
        </div>
    </main>
    <script>
        const messageInput = document.querySelector(".chat-input input");
        const sendButton = document.querySelector(".send-button");
        const chatMessages = document.querySelector(".chat-messages");
        const findPlaceButton = document.querySelector("#find-place");
        const placeOptions = document.querySelector("#place-options");

        function sendMessage() {
            const text = messageInput.value.trim();

            if (text === "") return;

            const message = document.createElement("div");

            message.className = "message message-sent";
            message.textContent = text;

            chatMessages.appendChild(message);

            messageInput.value = "";

            messageInput.focus();
        }

        sendButton.addEventListener("click", sendMessage);

        messageInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        findPlaceButton.addEventListener("click", function () {
            if (placeOptions.style.display === "block") {
                placeOptions.style.display = "none";
            } else {
                placeOptions.style.display = "block";
            }
        });

        const placeButtons = document.querySelectorAll(".place-option");

        placeButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                const placeName = button.dataset.place;

                const placeType = button.dataset.type;

                const placeAddress = button.dataset.address;

                const placeMessage = document.createElement("div");

                placeMessage.className = "message message-sent place-message";

                placeMessage.innerHTML = `
    <div class="place-name">${placeName}</div>
    <div class="place-type">${placeType}</div>
<small>📍 ${placeAddress}</small>

    <small>Suggested meeting place</small>
    <div class="place-actions">
    <button class="accept-place">Accept</button>
    <button class="another-place">Suggest another</button>
    </div>
    `;

                chatMessages.appendChild(placeMessage);

                placeOptions.style.display = "none";

                messageInput.focus();
            });

        });

        document.addEventListener("click", function (event) {

            if (event.target.classList.contains("accept-place")) {

                const placeMessage = event.target.closest(".place-message");
                const placeName = placeMessage.querySelector(".place-name").textContent;

                placeMessage.innerHTML = `
    <div class="place-name">${placeName}</div>
    <div class="place-confirmed">✓ Meeting place confirmed</div>
    `;

            }

        });

        document.addEventListener("click", function (event) {

            if (event.target.classList.contains("another-place")) {

                placeOptions.style.display = "block";

                placeOptions.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });
            }

        });

    </script>

</body>

</html>
