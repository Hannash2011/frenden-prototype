<script>
    const messageInput = document.querySelector(".chat-input input");
    const sendButton = document.querySelector(".send-button");
    const chatMessages = document.querySelector(".chat-messages");
    const findPlaceButton = document.querySelector("#find-place");
    const placeOptions = document.querySelector("#place-options");

    function sendMessage() {
        const text = messageInput.value.trim();

        if (text === "") return;

        const message = document.createElement("div");

        message.className = "message message-sent";
        message.textContent = text;

        chatMessages.appendChild(message);

        messageInput.value = "";

        messageInput.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    findPlaceButton.addEventListener("click", function () {
        if (placeOptions.style.display === "block") {
            placeOptions.style.display = "none";
        } else {
            placeOptions.style.display = "block";
        }
    });
