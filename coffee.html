<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee | FrenDen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-left">
            <a href="index.html" class="logo">FrenDen</a>
        </div>

        <div class="header-center">
            <div class="search">
                <input type="text" placeholder="Search experiences...">
                <button class="search-btn">⌕</button>
            </div>
        </div>

        <div class="header-right">
            <button class="nav-btn">Create</button>
            <button class="icon-btn">🌿</button>
            <button class="profile">🙂</button>
        </div>

    </header>

    <main class="main">

        <div class="breadcrumbs">
            <a href="index.html">Home</a>
            <span>›</span>
            <a href="coffee-walk.html">Coffee & Walk</a>
            <span>›</span>
            <span class="current">Coffee</span>
        </div>

        <section class="intro">
            <h1>Coffee</h1>
            <p>Find people for coffee and good conversations.</p>
        </section>


        <section class="filters">

            <button>📅 Today</button>
            <button>🗓 This Week</button>
            <button>🌅 Morning</button>
            <button>☀️ Afternoon</button>
            <button>🌇 Evening</button>
            <button>📍 Nearby</button>

        </section>


        <a href="anna-profile.html" class="user-card">

            <div class="user-top">

                <div class="avatar">
                </div>

                <div class="user-info">
                    <h2>Anna, 28</h2>
                    <p>📍 Oslo • 1.2 km away</p>
                </div>

                <div class="status">
                    🟢 Online
                </div>

            </div>
            <div class="user-title">
                ☕ Coffee after work
            </div>


            <div class="user-text">
                Looking for someone to try a cozy café
                and have a relaxed conversation.
            </div>


            <div class="user-time">
                🕕 Today • 18:30
            </div>


            <div class="tags">

                <span>☕ Coffee</span>
                <span>💬 Chat</span>
                <span>🚶 Walk</span>

            </div>
        </a>


        <!-- Здесь мы будем добавлять карточки пользователей -->

    </main>

</body>

</html>
