<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrenDen</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header class="header">

        <div class="header-left">
            <div class="logo">FrenDen</div>
        </div>

        <div class="header-center">
            <div class="search">
                <input type="text" placeholder="Search experiences..." />
                <button class="search-btn">⌕</button>
            </div>
        </div>

        <div class="header-right">
            <button class="nav-btn">Create</button>
            <button class="icon-btn">🌿</button>
            <button class="profile">🙂</button>
        </div>

    </header>


    <main class="main">

        <!-- HERO -->
        <section class="hero">
            <h1>Discover calm experiences</h1>
            <p>Nature, art, culture and quiet places around you</p>
        </section>

        <!-- FILTERS -->
        <section class="filters">
            <button>Nature</button>
            <button>Art</button>
            <button>Culture</button>
            <button>Food</button>
            <button>Calm</button>
        </section>

        <!-- GRID -->
        <section class="grid">

            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Lavender Fields Walk</div>
                <div class="card-sub">France · Nature · 2h</div>
            </div>

            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Modern Art Gallery</div>
                <div class="card-sub">Oslo · Art · 1.5h</div>
            </div>

            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Silent Café Space</div>
                <div class="card-sub">Local · Calm · Anytime</div>
            </div>

            <div class="card">
                <div class="card-img"></div>
                <div class="card-title">Forest Retreat</div>
                <div class="card-sub">Norway · Nature · Day trip</div>
            </div>

        </section>

    </main>

</body>

</html>
