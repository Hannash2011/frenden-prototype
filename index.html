<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrenDen</title>
    <link rel="stylesheet" href="styles.css" />
</head>


<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">✿</span>
            <span class="logo-text">FrenDen</span>
        </div>

        <div class="nav">
            <button class="nav-btn">Explore</button>
            <button class="nav-btn">Art & Culture</button>
            <button class="nav-btn">Favorites</button>
        </div>

        <div class="header-right">
            <div class="location-wrapper">
                <input id="locationInput" placeholder="Where?" />
            </div>

            <button class="profile-btn" id="profileBtn">
                <span class="profile-icon">🙂</span>
            </button>
        </div>
    </header>
    <main>

        <!-- ГЛАВНАЯ -->
        <section id="home" class="page active"></section>

        <!-- ПОДКАТЕГОРИИ -->
        <section id="subcategories" class="page"></section>

        <!-- ЛЮДИ -->
        <section id="people" class="page"></section>

        <!-- ПРОФИЛЬ -->
        <section id="profile" class="page"></section>

        <!-- ЧАТ -->
        <section id="chat" class="page"></section>

    </main>

    <script src="app.js"></script>




</body>

</html>
