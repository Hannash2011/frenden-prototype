<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrenDen</title>
    <link rel="stylesheet" href="styles.css" />
</head>


<body>
    <header class="header-page">
        <div class="header-inner">

            <!-- ВЕРХ -->
            <div class="header-top">

                <div class="header-left">
                    <img src="images/image.png" class="logo-img">
                    <span class="logo-text">FrenDen</span>
                </div>

                <div class="header-right">
                    <div class="chat">💬</div>
                    <div class="profile">👤</div>
                    <div class="login">Login</div>
                </div>

            </div>

            <!-- ПОИСК -->
            <div class="search-block">

                <input type="text" class="main-search" placeholder="What shall we do?">

                <!-- НИЖНЯЯ ПОЛОСА -->
                <div class="search-extra">

                    <!-- LOCATION -->
                    <div class="location-wrapper">
                        <button type="button" class="location" id="locationBtn">
                            🌍 Anywhere
                        </button>
                        <div class="location-dropdown" id="locationDropdown">
                            <div class="location-option">🌍 Anywhere</div>
                            <div class="location-option">📍 Near me</div>

                            <input type="text" id="locationInput" placeholder="Enter city or country...">
                        </div>
                    </div>

                    <!-- DATE -->
                    <button type="button" class="date" id="dateBtn">
                        📅 Any day
                    </button>
                    <input type="date" id="calendar" style="display: none;">


                </div>

                <!-- скрытый календарь -->


                <!-- подсказки -->
                <div class="suggestions" id="suggestions"></div>

            </div>

        </div>
    </header>
    <main>

        <!-- ГЛАВНАЯ -->
        <section id="home" class="page active"></section>

        <!-- ПОДКАТЕГОРИИ -->
        <section id="subcategories" class="page"></section>

        <!-- ЛЮДИ -->
        <section id="people" class="page"></section>

        <!-- ПРОФИЛЬ -->
        <section id="profile" class="page"></section>

        <!-- ЧАТ -->
        <section id="chat" class="page"></section>

    </main>

    <script src="app.js"></script>




</body>

</html>
